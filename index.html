<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🛒 Nexus Store</a>

            <div class="navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="filtroCategorias">

                    <li class="nav-item"><a class="nav-link" href="#" data-categoria="Roupas">Roupas</a></li>

                    <input id="inputBusca" class="form-control me-2" type="search" placeholder="Pesquisar..." />

                <a href="carrinho.html" class="btn btn-outline-light position-relative">
                    🛍️
                    <span id="iconCarrinho"

        </div>
    </nav>

    <main class="container my-4">
        <div id="produtos" class="row g-4"></div>
    </main>

    <script src="script.js"></script>
    <script src="index.js"></script>
